name: Stage Ablation v0.6.1 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/run_v061.py'
      - 'benchmark/stage_ablation_cases_v06.json'
      - '.github/workflows/reasoning-stage-ablation-v061.yml'
      - '.github/workflows/stage-ablation-v061-check.yml'
      - 'docs/STAGE_ABLATION_V0_6_1.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile run_v061.py

      - name: Validate source case JSON
        run: python -m json.tool stage_ablation_cases_v06.json > /dev/null

      - name: Validate ablation construction
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v061 as r

          assert len(r.CASES) == 10
          assert set(r.REMOVALS) == {'DIAGNOSE','PREDICT','TEST','REVISE','ENGINEER'}
          full = r.v03.pilot.FULL
          for family, fragments in r.REMOVALS.items():
              ablated = r.ablated_full_prompt(family)
              assert ablated != full
              for fragment in fragments:
                  assert fragment in full
                  assert fragment not in ablated

          # Verify the prediction and testing semantics survive one another's ablation.
          predict_ablated = r.ablated_full_prompt('PREDICT')
          test_ablated = r.ablated_full_prompt('TEST')
          assert 'prefer discriminating/falsifying tests' in predict_ablated
          assert 'derive observable predictions' in test_ablated

          # Unrelated capability sentences must remain under each ablation.
          for family in r.REMOVALS:
              ablated = r.ablated_full_prompt(family)
              if family != 'DIAGNOSE':
                  assert 'Generate multiple plausible explanations under material ambiguity.' in ablated
              if family != 'REVISE':
                  assert 'Contradictions require model revision.' in ablated
              if family != 'ENGINEER':
                  assert 'Engineer only after sufficient understanding' in ablated
          print('ablation construction validated')
          PY

      - name: Validate replicate-aware family aggregation
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v061 as r

          votes = []
          # Same case, two generation replicates with opposite unanimous verdicts.
          for rep, winner in [(1, 'FULL'), (2, 'ABLATED')]:
              for _ in range(3):
                  votes.append({
                      'family': 'DIAGNOSE', 'case_id': 'X', 'replicate': rep,
                      'winner': winner,
                      'focal_score': 1.0 if winner == 'FULL' else 0.0,
                  })
          out = r.family_breakdown(votes)['DIAGNOSE']
          assert out['n_case_replicates'] == 2
          assert out['mean_vote_agreement'] == 1.0
          assert out['case_scores']['X'] == 0.5
          print('replicate boundaries validated')
          PY

      - name: Smoke-import corrected runner
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: python -c "import run_v061; print('run_v061 import ok')"

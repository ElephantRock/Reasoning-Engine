name: Operator Fidelity v0.1 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/reasoning_policies_v01.py'
      - 'benchmark/operator_fidelity_cases_v01.json'
      - 'benchmark/run_operator_fidelity_v01.py'
      - 'docs/OPERATOR_FIDELITY_V0_1.md'
      - '.github/workflows/operator-fidelity-v01.yml'
      - '.github/workflows/operator-fidelity-v01-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and JSON
        run: |
          python -m py_compile reasoning_policies_v01.py run_operator_fidelity_v01.py
          python -m json.tool operator_fidelity_cases_v01.json > /dev/null

      - name: Validate frozen files and design
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_operator_fidelity_v01 as r

          assert len(r.CASES) == 6
          assert len(r.CONDITIONS) == 8
          assert set(r.SPECIALISTS) == {
              'DEDUCTIVE_CONSTRAINT',
              'ABDUCTIVE_DIAGNOSTIC',
              'CAUSAL_EXPERIMENTAL',
              'SEARCH_PLANNING',
              'DECISION_THEORETIC',
              'SYSTEMS_FEEDBACK',
          }
          assert {c['intended_policy'] for c in r.CASES} == set(r.SPECIALISTS)
          assert set(r.POLICY_DIMENSION.values()) == set(r.DIMENSIONS)
          assert r.JUDGE_VOTES == 2
          assert 'material_pathology' in r.QUALITY_JUDGE
          assert 'accuracy_pathology' in r.BEHAVIOR_JUDGE
          r.validate_frozen_files()
          print('operator fidelity v0.1 frozen design validated')
          PY

      - name: Validate pathology gate wiring
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import copy
          import run_operator_fidelity_v01 as r

          runs = []
          votes = []
          quality = []
          for case in r.CASES:
              operator = case['intended_policy']
              dim = r.POLICY_DIMENSION[operator]
              for condition in r.CONDITIONS:
                  runs.append({
                      'case_id': case['case_id'],
                      'condition': condition,
                      'text': 'x',
                      'usage': {'input_tokens': 1, 'output_tokens': 1, 'latency_ms': 1},
                  })
                  score = 1.0
                  if condition == operator:
                      score = 2.0
                  elif condition == 'FULL':
                      score = 1.5
                  scores = {name: 0.0 for name in r.DIMENSIONS}
                  scores[dim] = score
                  for vote_index in range(1, r.JUDGE_VOTES + 1):
                      votes.append({
                          'case_id': case['case_id'],
                          'condition': condition,
                          'vote_index': vote_index,
                          'scores': scores,
                          'accuracy_pathology': False,
                      })
              for opponent in ('CONTROL', 'FULL'):
                  quality.append({
                      'case_id': case['case_id'],
                      'pair_id': f'{operator}_vs_{opponent}',
                      'material_pathology': False,
                      'pathology_condition': None,
                      'pathology_note': '',
                  })

          clean = r.aggregate(runs, votes, quality)
          assert clean['program_decision'] == 'PASS_ALL_SIX'
          assert len(clean['eligible_operators']) == 6

          blocked_quality = copy.deepcopy(quality)
          first_case = r.CASES[0]
          first_operator = first_case['intended_policy']
          target_vote = next(q for q in blocked_quality if q['case_id'] == first_case['case_id'])
          target_vote['material_pathology'] = True
          target_vote['pathology_condition'] = first_operator
          target_vote['pathology_note'] = 'synthetic blocking error'
          blocked = r.aggregate(runs, votes, blocked_quality)
          row = next(x for x in blocked['operator_rows'] if x['operator'] == first_operator)
          assert row['quality_material_pathology'] is True
          assert row['stage1_eligible'] is False
          assert len(blocked['eligible_operators']) == 5
          print('quality pathology gate blocks Stage-1 eligibility as specified')
          PY

      - name: Validate no operator-label leakage in case prompts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cases = json.loads(Path('operator_fidelity_cases_v01.json').read_text())
          forbidden = ['deductive', 'abductive', 'causal-experimental', 'search/planning', 'decision-theoretic', 'systems-feedback']
          for case in cases:
              text = case['agent_input'].lower()
              for token in forbidden:
                  assert token not in text, (case['case_id'], token)
          print('no explicit operator labels in prompts')
          PY

      - name: Validate paid workflow configuration
        run: |
          grep -q 'ZAI_TARGET_MODEL: glm-5.1' ../.github/workflows/operator-fidelity-v01.yml
          grep -q 'ZAI_JUDGE_MODEL: glm-5.3-flash' ../.github/workflows/operator-fidelity-v01.yml
          grep -q 'run_operator_fidelity_v01.py' ../.github/workflows/operator-fidelity-v01.yml

      - name: Smoke import
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          BENCHMARK_SUITE: combined
        run: python -c "import run_operator_fidelity_v01; print('operator fidelity import ok')"

name: Operator Fidelity v0.1 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/reasoning_policies_v01.py'
      - 'benchmark/operator_fidelity_cases_v01.json'
      - 'benchmark/run_operator_fidelity_v01.py'
      - 'docs/OPERATOR_FIDELITY_V0_1.md'
      - '.github/workflows/operator-fidelity-v01.yml'
      - '.github/workflows/operator-fidelity-v01-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and JSON
        run: |
          python -m py_compile reasoning_policies_v01.py run_operator_fidelity_v01.py
          python -m json.tool operator_fidelity_cases_v01.json > /dev/null

      - name: Validate frozen files and design
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_operator_fidelity_v01 as r

          assert len(r.CASES) == 6
          assert len(r.CONDITIONS) == 8
          assert set(r.SPECIALISTS) == {
              'DEDUCTIVE_CONSTRAINT',
              'ABDUCTIVE_DIAGNOSTIC',
              'CAUSAL_EXPERIMENTAL',
              'SEARCH_PLANNING',
              'DECISION_THEORETIC',
              'SYSTEMS_FEEDBACK',
          }
          assert {c['intended_policy'] for c in r.CASES} == set(r.SPECIALISTS)
          assert set(r.POLICY_DIMENSION.values()) == set(r.DIMENSIONS)
          assert r.JUDGE_VOTES == 2
          r.validate_frozen_files()
          print('operator fidelity v0.1 frozen design validated')
          PY

      - name: Validate no operator-label leakage in case prompts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cases = json.loads(Path('operator_fidelity_cases_v01.json').read_text())
          forbidden = ['deductive', 'abductive', 'causal-experimental', 'search/planning', 'decision-theoretic', 'systems-feedback']
          for case in cases:
              text = case['agent_input'].lower()
              for token in forbidden:
                  assert token not in text, (case['case_id'], token)
          print('no explicit operator labels in prompts')
          PY

      - name: Validate paid workflow configuration
        run: |
          grep -q 'ZAI_TARGET_MODEL: glm-5.1' ../.github/workflows/operator-fidelity-v01.yml
          grep -q 'ZAI_JUDGE_MODEL: glm-5.3-flash' ../.github/workflows/operator-fidelity-v01.yml
          grep -q 'run_operator_fidelity_v01.py' ../.github/workflows/operator-fidelity-v01.yml

      - name: Smoke import
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          BENCHMARK_SUITE: combined
        run: python -c "import run_operator_fidelity_v01; print('operator fidelity import ok')"

name: Framework Validation v1 Independent Rejudge Static Check

on:
  pull_request:
    paths:
      - 'benchmark/rejudge_framework_validation_v1_independent.py'
      - 'benchmark/aggregate_framework_validation_v1_independent_rejudge.py'
      - 'docs/HELDOUT_FRAMEWORK_VALIDATION_V1_INDEPENDENT_REJUDGE_PREREG.md'
      - '.github/workflows/reasoning-heldout-framework-validation-v1-independent-rejudge.yml'
      - '.github/workflows/framework-v1-independent-rejudge-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: unused-static-target-key
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TARGET_MODEL: glm-5.1
      ZAI_JUDGE_API_KEY: unused-static-independent-key
      ZAI_JUDGE_BASE_URL: https://independent.example.test/v1
      ZAI_JUDGE_MODEL: independent-judge-model
      FRAMEWORK_TARGET_FAMILY: glm
      FRAMEWORK_TARGET_PROVIDER: zai
      FRAMEWORK_JUDGE_FAMILY: independent-family
      FRAMEWORK_JUDGE_PROVIDER: independent-provider
      FRAMEWORK_INDEPENDENT_EVALUATOR_ATTESTATION: 'true'
      FRAMEWORK_GENERATION_REPLICATES: '3'
      FRAMEWORK_JUDGE_VOTES: '3'
      FRAMEWORK_SHARD_COUNT: '6'
      FRAMEWORK_SHARD_INDEX: '0'
      BENCHMARK_SUITE: combined
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r benchmark/requirements.txt
      - name: Validate Python syntax
        run: |
          python -m py_compile \
            benchmark/rejudge_framework_validation_v1_independent.py \
            benchmark/aggregate_framework_validation_v1_independent_rejudge.py
      - name: Validate independent evaluator gate
        working-directory: benchmark
        run: |
          python - <<'PY'
          import rejudge_framework_validation_v1_independent as r
          b = r.base
          r.independent_preflight()
          assert b.v03.TARGET_MODEL == 'glm-5.1'
          assert b.TARGET_FAMILY == 'glm'
          assert b.TARGET_PROVIDER == 'zai'
          assert b.v03.JUDGE_MODEL == 'independent-judge-model'
          assert b.JUDGE_FAMILY == 'independent-family'
          assert b.JUDGE_PROVIDER == 'independent-provider'
          assert b.normalize_url(b.v03.JUDGE_BASE) != b.normalize_url(b.v03.TARGET_BASE)
          print('independent evaluator gate validated')
          PY
      - name: Validate gate fails closed for same family
        working-directory: benchmark
        run: |
          python - <<'PY'
          import rejudge_framework_validation_v1_independent as r
          b = r.base
          original = b.JUDGE_FAMILY
          b.JUDGE_FAMILY = b.TARGET_FAMILY
          try:
              r.independent_preflight()
          except RuntimeError as exc:
              assert 'families are identical' in str(exc)
          else:
              raise AssertionError('same-family judge did not fail closed')
          finally:
              b.JUDGE_FAMILY = original
          print('same-family rejection validated')
          PY
      - name: Validate frozen target-output reuse and no target calls
        working-directory: benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          import rejudge_framework_validation_v1_independent as r
          b = r.base
          shard_cases = [case for i, case in enumerate(b.CASES) if i % b.SHARD_COUNT == b.SHARD_INDEX]
          runs = [
              {'case_id': case_id, 'condition': condition, 'replicate': replicate}
              for case_id, condition, replicate in sorted(r.expected_run_keys(shard_cases))
          ]
          meta = {
              'suite': 'heldout_cases_v1.json',
              'suite_freeze_commit': '2975376ade5df0863340ce10aa867f3b3e0e1404',
              'suite_git_blob_sha': '5fa2ab6f678728124b93ea9dd6c9158e5d6e9698',
              'generation_replicates': 3,
              'judge_votes_per_pair': 3,
              'conditions': list(b.CONDITIONS),
              'prompt_sha256': {
                  'CONTROL': None,
                  'COMPACT': b.sha256_text(b.COMPACT),
                  'FULL': b.sha256_text(b.FULL),
              },
              'target': {
                  'model': b.FROZEN_TARGET_MODEL,
                  'family': b.FROZEN_TARGET_FAMILY,
                  'provider': b.FROZEN_TARGET_PROVIDER,
                  'base_url': b.FROZEN_TARGET_BASE,
              },
              'execution_recovery': {
                  'source_run_id': 34232674771,
                  'retained_target_runs': 54,
                  'target_regeneration_allowed': False,
              },
          }
          index = r.validate_source_checkpoint(runs, meta, shard_cases)
          assert len(index) == r.EXPECTED_RUNS_PER_SHARD == 54
          assert len(r.SOURCE_ARTIFACT_DIGESTS) == 6
          text = Path('rejudge_framework_validation_v1_independent.py').read_text()
          assert 'target_call(' not in text
          assert 'run_case(' not in text
          print('frozen-output reuse and no-target-call invariant validated')
          PY
      - name: Validate outcome-blind format parser
        working-directory: benchmark
        run: |
          python - <<'PY'
          import json
          import rejudge_framework_validation_v1_independent as r
          assert r.parse_first_json_object('{"winner":"A"}') == {'winner': 'A'}
          assert r.parse_first_json_object('prefix {"winner":"B"} suffix') == {'winner': 'B'}
          assert r.parse_first_json_object('{"winner":"TIE"}\nextra') == {'winner': 'TIE'}
          try:
              r.parse_first_json_object('{"winner" "A"}')
          except json.JSONDecodeError:
              pass
          else:
              raise AssertionError('malformed JSON was repaired')
          assert r.MAX_FORMAT_ATTEMPTS == 3
          print('format policy validated')
          PY
      - name: Validate frozen thresholds and independent report labeling
        working-directory: benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          import aggregate_framework_validation_v1 as a
          text = Path('aggregate_framework_validation_v1_independent_rejudge.py').read_text()
          assert a.PRIMARY_MIN_SCORE == 0.60
          assert a.PRIMARY_CI_LOW_MIN_EXCLUSIVE == 0.50
          assert a.STRATUM_HARM_FLOOR == 0.45
          assert a.ARCH_FULL_DIRECTION == 0.55
          assert a.ARCH_COMPACT_DIRECTION == 0.45
          assert 'Tier-2 independent-family/provider judging' in text
          assert 'target_outputs_regenerated' in text
          assert 'prior_glm53flash_votes_reused' in text
          print('frozen thresholds and Tier-2 labeling validated')
          PY
      - name: Validate dormant workflow and source provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/reasoning-heldout-framework-validation-v1-independent-rejudge.yml').read_text()
          secret_ref = '$' + '{{ secrets.' + 'INDEPENDENT_JUDGE_API_KEY }}'
          assert '[run-heldout-framework-v1-independent-rejudge]' in workflow
          assert f'ZAI_JUDGE_API_KEY: {secret_ref}' in workflow
          assert 'INDEPENDENT_JUDGE_BASE_URL' in workflow
          assert 'INDEPENDENT_JUDGE_MODEL' in workflow
          assert 'INDEPENDENT_JUDGE_FAMILY' in workflow
          assert 'INDEPENDENT_JUDGE_PROVIDER' in workflow
          assert 'run-id: 34270142523' in workflow
          assert 'framework-v1-glm53flash-recovered-shard-${{ matrix.shard }}-34270142523' in workflow
          assert 'python rejudge_framework_validation_v1_independent.py' in workflow
          assert 'python aggregate_framework_validation_v1_independent_rejudge.py' in workflow
          assert 'max-parallel: 2' in workflow
          print('dormant independent workflow validated')
          PY

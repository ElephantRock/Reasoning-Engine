name: Process-Constrained Phase B v0.2 Runner Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v0.2 runner sources
        run: |
          python -m py_compile \
            run_process_phase_b_v02.py \
            run_process_phase_b_v02_reviewed.py \
            test_process_phase_b_runner_v02.py
      - name: Validate corrected design without model calls
        env:
          ZAI_TARGET_MODEL: glm-5.1
        run: python run_process_phase_b_v02.py
      - name: Run v0.2 runner tests
        env:
          ZAI_TARGET_MODEL: glm-5.1
        run: python -m unittest -v test_process_phase_b_v02_corrections.py test_process_phase_b_runner_v02.py
      - name: Enforce runner authorization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          core = Path('run_process_phase_b_v02.py').read_text()
          reviewed = Path('run_process_phase_b_v02_reviewed.py').read_text()
          assert 'PHASE_B_V02_EXECUTION_AUTHORIZED' in reviewed
          assert '!= "1"' in reviewed
          assert 'core.zai_model_call' in reviewed
          assert 'family_balanced_cyclic_rotation_v1' in reviewed
          assert 'round_robin_four_families' in reviewed
          assert 'process-constrained-phase-b-v0.2' in core
          manifest = json.loads(Path('process_phase_b_freeze_v02.json').read_text())
          assert manifest['authorization_state'] == 'NOT_AUTHORIZED_BY_MANIFEST'
          print('v0.2 runner remains hard-gated; authorization is supplied only by the manual orchestration layer')
          PY

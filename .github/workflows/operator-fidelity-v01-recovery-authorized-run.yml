name: Operator Fidelity v0.1 Recovery Authorized Run

on:
  push:
    branches:
      - 'run/operator-fidelity-v0.1-recovery'
    paths:
      - '.github/workflows/operator-fidelity-v01-recovery-authorized-run.yml'

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: benchmark
    env:
      OPENAI_API_KEY: unused-provider-shim
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_TARGET_MODEL: glm-5.1
      ZAI_JUDGE_MODEL: glm-5.3-flash
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_JUDGE_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TEMPERATURE: '0'
      ZAI_JUDGE_TEMPERATURE: '0'
      ZAI_MAX_TOKENS: '16384'
      ZAI_JUDGE_MAX_TOKENS: '8192'
      BENCHMARK_SUITE: combined
      OPERATOR_FIDELITY_SOURCE_RUNS: recovery_source/runs.jsonl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download frozen source artifact
        uses: actions/download-artifact@v4
        with:
          name: operator-fidelity-v01-results-authorized
          path: benchmark/recovery_source
          github-token: ${{ github.token }}
          repository: ElephantRock/Reasoning-Engine
          run-id: '34710001873'

      - name: Validate frozen recovery source and runtime
        run: |
          python - <<'PY'
          import os
          import recover_operator_fidelity_v01 as r
          assert os.environ['ZAI_TARGET_MODEL'] == 'glm-5.1'
          assert os.environ['ZAI_JUDGE_MODEL'] == 'glm-5.3-flash'
          assert os.environ['ZAI_BASE_URL'] == 'https://api.z.ai/api/coding/paas/v4'
          assert os.environ['ZAI_JUDGE_BASE_URL'] == 'https://api.z.ai/api/coding/paas/v4'
          assert os.environ['ZAI_TEMPERATURE'] == '0'
          assert os.environ['ZAI_JUDGE_TEMPERATURE'] == '0'
          assert int(os.environ['ZAI_MAX_TOKENS']) == r.RECOVERY_TARGET_CAP == 16384
          assert int(os.environ['ZAI_JUDGE_MAX_TOKENS']) == r.RECOVERY_JUDGE_CAP == 8192
          source = r.read_jsonl(r.SOURCE_RUNS)
          r.validate_source_runs(source)
          assert sum(r.needs_regeneration(x) for x in source) == 20
          print('frozen recovery source and runtime validated')
          PY

      - name: Run operator fidelity recovery
        run: python recover_operator_fidelity_v01.py

      - name: Show summary
        if: always()
        run: |
          if [ -f results_operator_fidelity_v01_recovery/summary.json ]; then
            cat results_operator_fidelity_v01_recovery/summary.json
          fi

      - name: Upload recovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-fidelity-v01-recovery-results
          path: benchmark/results_operator_fidelity_v01_recovery/
          if-no-files-found: warn
          retention-days: 30

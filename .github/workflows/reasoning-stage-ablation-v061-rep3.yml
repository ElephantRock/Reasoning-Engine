name: Reasoning Stage Ablation v0.6.1 Replication 3x

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  stage-ablation-v061-rep3:
    if: contains(github.event.head_commit.message, '[run-v061-rep3]')
    runs-on: ubuntu-latest
    timeout-minutes: 420
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.ZAI_JUDGE_API_KEY }}
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_JUDGE_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TARGET_MODEL: glm-5.1
      ZAI_JUDGE_MODEL: glm-5.1
      ZAI_JUDGE_TEMPERATURE: '0.2'
      ABLATION_GENERATION_REPLICATES: '3'
      ABLATION_JUDGE_VOTES: '3'
      BENCHMARK_SUITE: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify frozen replication configuration
        shell: bash
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "ZAI_API_KEY repository secret is required." >&2
            exit 1
          fi
          test "$ABLATION_GENERATION_REPLICATES" = "3"
          test "$ABLATION_JUDGE_VOTES" = "3"
          if [ -z "$ZAI_JUDGE_API_KEY" ]; then
            echo "ZAI_JUDGE_API_KEY is not set; evaluator will fall back to ZAI_API_KEY."
          fi
          echo "Frozen replication: unchanged run_v061.py, 10 existing cases, 3 generation replicates, 3 judge votes."
          echo "WARNING: target and judge remain glm-5.1 on the same endpoint unless repository secrets/config are changed outside this workflow."

      - name: Run v0.6.1 three-generation replication
        run: python run_v061.py

      - name: Upload replication results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-stage-ablation-v061-rep3-${{ github.run_id }}
          path: benchmark/results_v061/
          if-no-files-found: warn
          retention-days: 30

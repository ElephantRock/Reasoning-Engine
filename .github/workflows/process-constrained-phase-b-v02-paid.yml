name: Process-Constrained Phase B v0.2

on:
  workflow_dispatch:
    inputs:
      authorization_phrase:
        description: 'Type AUTHORIZE_PHASE_B_V02_PAID_RUN to consume the one-shot paid authorization'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: process-constrained-phase-b-v02-paid
  cancel-in-progress: false

env:
  ZAI_TARGET_MODEL: glm-5.1
  ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
  ZAI_TEMPERATURE: 0
  ZAI_MAX_TOKENS: 16384
  PHASE_B_ENFORCE_RUNTIME_ENV: 1
  PHASE_B_V02_EXECUTION_AUTHORIZED: 1
  PHASE_B_V02_FROZEN_SOURCE_SHA: 21bf33d7d7f5d36aa224e938bc3fca9f3cc7e5be

jobs:
  run:
    if: github.ref == 'refs/heads/main' && inputs.authorization_phrase == 'AUTHORIZE_PHASE_B_V02_PAID_RUN'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21bf33d7d7f5d36aa224e938bc3fca9f3cc7e5be
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact frozen source revision
        run: |
          test "$(git rev-parse HEAD)" = "$PHASE_B_V02_FROZEN_SOURCE_SHA"
          echo "frozen source $PHASE_B_V02_FROZEN_SOURCE_SHA verified"
      - name: Enforce one-shot accepted authorization
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          run_id = int(os.environ["CURRENT_RUN_ID"])
          run_attempt = int(os.environ["CURRENT_RUN_ATTEMPT"])
          if run_attempt != 1:
              raise SystemExit("Phase B v0.2 reruns are not authorized; freeze a recovery instead")

          repo = os.environ["REPOSITORY"]
          workflow = urllib.parse.quote("process-constrained-phase-b-v02-paid.yml", safe="")
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs"
              "?event=workflow_dispatch&branch=main&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          data = None
          for _ in range(10):
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              ids = [int(item["id"]) for item in data.get("workflow_runs", [])]
              if run_id in ids:
                  break
              time.sleep(2)
          else:
              raise SystemExit("Current workflow run was not visible to the one-shot authorization check")

          runs = data.get("workflow_runs", [])
          if int(data.get("total_count", 0)) > 100:
              raise SystemExit("More than 100 main dispatches exist; one-shot status cannot be established safely")

          # Dispatches with the wrong confirmation phrase produce a skipped sole
          # job and do not consume authorization. Any non-skipped prior dispatch,
          # including failure/cancellation/technical interruption, does consume it.
          accepted_ids = sorted(
              int(item["id"])
              for item in runs
              if int(item["id"]) == run_id or item.get("conclusion") != "skipped"
          )
          if not accepted_ids or run_id != accepted_ids[0]:
              prior = accepted_ids[0] if accepted_ids else "unknown"
              raise SystemExit(f"Phase B v0.2 authorization already consumed by accepted dispatch {prior}")
          print(f"one-shot authorization accepted for first accepted main dispatch {run_id}")
          PY
      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: benchmark/requirements_process_phase_b_v02.txt
      - name: Install frozen dependencies
        run: python -m pip install -r requirements_process_phase_b_v02.txt
      - name: Validate frozen artifacts and runtime configuration
        run: python validate_process_phase_b_freeze_v02.py
      - name: Re-run complete zero-cost v0.2 validation before provider calls
        env:
          ZAI_API_KEY: ''
        run: |
          python process_phase_b_suite_v02.py
          python -m unittest -v \
            test_process_phase_b_v02_corrections.py \
            test_process_phase_b_runner_v02.py \
            test_process_phase_b_v02_final_review.py
      - name: Run frozen Process-Constrained Phase B v0.2
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python run_process_phase_b_v02_reviewed.py
      - name: Show result summary or interruption metadata
        if: always()
        run: |
          if [ -f results_process_phase_b_v02/summary.json ]; then
            cat results_process_phase_b_v02/summary.json
          fi
          if [ -f results_process_phase_b_v02/partial_meta.json ]; then
            cat results_process_phase_b_v02/partial_meta.json
          fi
      - name: Record execution environment
        if: always()
        run: |
          mkdir -p results_process_phase_b_v02
          python --version > results_process_phase_b_v02/runtime_environment.txt || true
          python -m pip freeze >> results_process_phase_b_v02/runtime_environment.txt || true
          printf '\nRUNNER_IMAGE=%s\nFROZEN_SOURCE_SHA=%s\nAUTHORIZED_RUN_ID=%s\nAUTHORIZED_RUN_ATTEMPT=%s\n' \
            "${ImageOS:-unknown}" "$PHASE_B_V02_FROZEN_SOURCE_SHA" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            >> results_process_phase_b_v02/runtime_environment.txt || true
      - name: Upload Phase B v0.2 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-constrained-phase-b-v02-results
          path: benchmark/results_process_phase_b_v02/
          if-no-files-found: warn
          retention-days: 30

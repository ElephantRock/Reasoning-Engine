name: Operator Fidelity v0.2 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/reasoning_policies_v02.py'
      - 'benchmark/operator_fidelity_cases_v02.json'
      - 'benchmark/run_operator_fidelity_v02.py'
      - 'benchmark/run_operator_fidelity_v02_target.py'
      - 'benchmark/run_operator_fidelity_v02_judge.py'
      - 'docs/OPERATOR_FIDELITY_V0_1_RESULTS.md'
      - 'docs/OPERATOR_FIDELITY_V0_2.md'
      - '.github/workflows/operator-fidelity-v02-check.yml'
      - '.github/workflows/operator-fidelity-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      OPENAI_API_KEY: unused-provider-shim
      ZAI_API_KEY: unused-zai-shim
      ZAI_TARGET_MODEL: glm-5.1
      ZAI_JUDGE_MODEL: glm-5.3-flash
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_JUDGE_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TEMPERATURE: '0'
      ZAI_JUDGE_TEMPERATURE: '0'
      ZAI_MAX_TOKENS: '32768'
      ZAI_JUDGE_MAX_TOKENS: '16384'
      BENCHMARK_SUITE: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and JSON
        run: |
          python -m py_compile reasoning_policies_v02.py run_operator_fidelity_v02.py run_operator_fidelity_v02_target.py run_operator_fidelity_v02_judge.py
          python -m json.tool operator_fidelity_cases_v02.json > /dev/null

      - name: Validate frozen design
        run: |
          python - <<'PY'
          import reasoning_policies_v01 as v01
          import reasoning_policies_v02 as p
          import run_operator_fidelity_v02 as r

          r.validate_frozen_files()
          assert p.FULL == v01.FULL
          assert len(r.CASES) == 12
          assert len(r.CONDITIONS) == 8
          assert len(r.SPECIALISTS) == 6
          assert r.JUDGE_VOTES == 2
          assert r.TARGET_CAP == 32768
          assert r.JUDGE_CAP == 16384
          assert r.MAX_FORMAT_ATTEMPTS == 3
          assert set(r.FIDELITY_CRITERIA) == set(r.SPECIALISTS)
          assert all(len(x) == 5 for x in r.FIDELITY_CRITERIA.values())
          for name in r.SPECIALISTS:
              assert sum(c['intended_policy'] == name for c in r.CASES) == 2
          print('v0.2 frozen design validated')
          PY

      - name: Validate case-label blindness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cases = json.loads(Path('operator_fidelity_cases_v02.json').read_text())
          forbidden = [
              'deductive', 'abductive', 'causal effect', 'causal reasoning',
              'search/planning', 'decision-theoretic', 'systems-feedback',
              'feedback loop', 'value of information'
          ]
          for case in cases:
              text = case['agent_input'].lower()
              for token in forbidden:
                  assert token not in text, (case['case_id'], token)
          assert len({c['agent_input'] for c in cases}) == 12
          print('no explicit operator labels in v0.2 user prompts')
          PY

      - name: Validate fidelity and pathology gates
        run: |
          python - <<'PY'
          import copy
          import run_operator_fidelity_v02 as r

          runs = []
          votes = []
          quality = []
          for case in r.CASES:
              intended = case['intended_policy']
              for condition in r.CONDITIONS:
                  runs.append({
                      'case_id': case['case_id'],
                      'intended_policy': intended,
                      'condition': condition,
                      'text': 'synthetic complete answer',
                      'finish_reason': 'stop',
                      'usage': {'input_tokens': 1, 'output_tokens': 1, 'latency_ms': 1},
                  })
                  score = 1.0 if condition == intended else 0.5
                  if condition == 'FULL':
                      score = 0.75
                  for vote_index in (1, 2):
                      votes.append({
                          'case_id': case['case_id'],
                          'condition': condition,
                          'vote_index': vote_index,
                          'scores': {f'c{i}': score for i in range(1, 6)},
                          'accuracy_pathology': False,
                      })
              for opponent in ('CONTROL', 'FULL'):
                  quality.append({
                      'case_id': case['case_id'],
                      'pair_id': f'{intended}_vs_{opponent}',
                      'material_pathology': False,
                      'pathology_condition': None,
                  })

          clean = r.aggregate(runs, votes, quality)
          assert clean['program_decision'] == 'PASS_ALL_SIX'
          assert len(clean['eligible_operators']) == 6
          assert all(abs(row['lift_control'] - 0.5) < 1e-12 for row in clean['operator_rows'])
          assert all(abs(row['separation'] - 0.5) < 1e-12 for row in clean['operator_rows'])

          blocked_votes = copy.deepcopy(votes)
          first = r.CASES[0]
          target = next(v for v in blocked_votes if v['case_id'] == first['case_id'] and v['condition'] == first['intended_policy'])
          target['accuracy_pathology'] = True
          blocked = r.aggregate(runs, blocked_votes, quality)
          assert len(blocked['eligible_operators']) == 5
          assert blocked['program_decision'] == 'PASS_SUBSET_REDESIGN_STAGE1'
          print('v0.2 fidelity and pathology gates validated')
          PY

      - name: Validate target artifact handoff
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import run_operator_fidelity_v02 as r
          import run_operator_fidelity_v02_target as t
          import run_operator_fidelity_v02_judge as j

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              runs_path = root / 'runs.jsonl'
              meta_path = root / 'target_meta.json'
              runs = []
              for case in r.CASES:
                  for condition in r.CONDITIONS:
                      runs.append({
                          'case_id': case['case_id'],
                          'intended_policy': case['intended_policy'],
                          'condition': condition,
                          'text': 'x',
                          'usage': {'input_tokens': 1, 'output_tokens': 1, 'latency_ms': 1},
                          'finish_reason': 'stop',
                      })
              r.write_jsonl(runs_path, runs)
              meta = {
                  'measurement_version': 'operator-fidelity-v0.2',
                  'target_model': r.v03.TARGET_MODEL,
                  'cases_blob': r.EXPECTED_CASES_BLOB,
                  'policies_blob': r.EXPECTED_POLICIES_BLOB,
                  'records': 96,
                  'runs_sha256': t.sha256_file(runs_path),
                  'target_cap': r.TARGET_CAP,
              }
              meta_path.write_text(json.dumps(meta), encoding='utf-8')
              loaded = j.load_frozen_targets(runs_path, meta_path)
              assert len(loaded) == 96
              meta['runs_sha256'] = 'bad'
              meta_path.write_text(json.dumps(meta), encoding='utf-8')
              try:
                  j.load_frozen_targets(runs_path, meta_path)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('hash mismatch was not rejected')
          print('target artifact handoff is hash-frozen')
          PY

      - name: Validate paid workflow configuration
        run: |
          grep -q 'workflow_dispatch' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'ZAI_TARGET_MODEL: glm-5.1' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'ZAI_JUDGE_MODEL: glm-5.3-flash' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'ZAI_MAX_TOKENS: 32768' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'ZAI_JUDGE_MAX_TOKENS: 16384' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'run_operator_fidelity_v02_target.py' ../.github/workflows/operator-fidelity-v02.yml
          grep -q 'run_operator_fidelity_v02_judge.py' ../.github/workflows/operator-fidelity-v02.yml

name: Reasoning Held-Out Framework Validation v1 — OpenAI Judge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
  ZAI_TARGET_MODEL: glm-5.1
  FRAMEWORK_TARGET_FAMILY: glm
  FRAMEWORK_TARGET_PROVIDER: zai
  ZAI_JUDGE_BASE_URL: https://api.openai.com/v1
  ZAI_JUDGE_MODEL: gpt-5.6-sol
  FRAMEWORK_JUDGE_FAMILY: gpt
  FRAMEWORK_JUDGE_PROVIDER: openai
  FRAMEWORK_INDEPENDENT_EVALUATOR_ATTESTATION: 'true'
  FRAMEWORK_GENERATION_REPLICATES: '3'
  FRAMEWORK_JUDGE_VOTES: '3'
  FRAMEWORK_SHARD_COUNT: '6'
  BENCHMARK_BOOTSTRAP_SAMPLES: '5000'
  BENCHMARK_SUITE: combined

jobs:
  validate-preflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-heldout-framework-v1-openai]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout frozen validation code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify credentials and independent judge before target calls
        shell: bash
        run: |
          test -n "$ZAI_API_KEY" || { echo 'ZAI_API_KEY is required.' >&2; exit 1; }
          test -n "$ZAI_JUDGE_API_KEY" || { echo 'OPENAI_API_KEY repository secret is required.' >&2; exit 1; }
          python - <<'PY'
          import run_framework_validation_v1 as r
          r.independent_evaluator_preflight()
          assert len(r.CASES) == 36
          assert r.CONDITIONS == ('CONTROL', 'COMPACT', 'FULL')
          usage = r.independent_evaluator_connectivity_check()
          print('Independent OpenAI judge preflight passed. Probe usage:', usage)
          PY

  run-shards:
    needs: validate-preflight
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FRAMEWORK_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout frozen validation code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run held-out framework shard
        run: python run_framework_validation_v1.py

      - name: Upload raw framework shard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-validation-v1-openai-shard-${{ matrix.shard }}
          path: |
            benchmark/results_framework_validation_v1/framework_v1_runs_shard_${{ matrix.shard }}.jsonl
            benchmark/results_framework_validation_v1/framework_v1_votes_shard_${{ matrix.shard }}.jsonl
            benchmark/results_framework_validation_v1/framework_v1_meta_shard_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: run-shards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      OPENAI_API_KEY: unused-aggregation-shim
      ZAI_API_KEY: unused-aggregation-shim
      ZAI_JUDGE_API_KEY: unused-aggregation-shim
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TARGET_MODEL: glm-5.1
      FRAMEWORK_TARGET_FAMILY: glm
      FRAMEWORK_TARGET_PROVIDER: zai
      ZAI_JUDGE_BASE_URL: https://api.openai.com/v1
      ZAI_JUDGE_MODEL: gpt-5.6-sol
      FRAMEWORK_JUDGE_FAMILY: gpt
      FRAMEWORK_JUDGE_PROVIDER: openai
      FRAMEWORK_INDEPENDENT_EVALUATOR_ATTESTATION: 'true'
      FRAMEWORK_GENERATION_REPLICATES: '3'
      FRAMEWORK_JUDGE_VOTES: '3'
      FRAMEWORK_SHARD_COUNT: '6'
      FRAMEWORK_SHARD_INDEX: '0'
      BENCHMARK_BOOTSTRAP_SAMPLES: '5000'
      BENCHMARK_SUITE: combined
    steps:
      - name: Checkout frozen validation code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all framework shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: framework-validation-v1-openai-shard-*
          merge-multiple: true
          path: benchmark/results_framework_validation_v1

      - name: Aggregate case-clustered framework validation result
        run: python aggregate_framework_validation_v1.py

      - name: Upload final framework validation report
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-heldout-framework-validation-v1-openai-${{ github.run_id }}
          path: |
            benchmark/results_framework_validation_v1/framework_v1_report.json
            benchmark/results_framework_validation_v1/framework_v1_runs_shard_*.jsonl
            benchmark/results_framework_validation_v1/framework_v1_votes_shard_*.jsonl
            benchmark/results_framework_validation_v1/framework_v1_meta_shard_*.json
          if-no-files-found: error
          retention-days: 90

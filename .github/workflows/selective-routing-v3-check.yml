name: Selective Routing v3 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/selective_router_v3.py'
      - 'benchmark/load_routing_validation_v3.py'
      - 'benchmark/preflight_selective_routing_v3.py'
      - 'benchmark/run_selective_routing_v3.py'
      - 'benchmark/aggregate_selective_routing_v3.py'
      - 'benchmark/routing_validation_v3/**'
      - 'docs/SELECTIVE_ROUTING_V3_PREREG.md'
      - '.github/workflows/reasoning-selective-routing-v3.yml'
      - '.github/workflows/selective-routing-v3-check.yml'
  push:
    branches: [main]
    paths:
      - 'benchmark/selective_router_v3.py'
      - 'benchmark/load_routing_validation_v3.py'
      - 'benchmark/preflight_selective_routing_v3.py'
      - 'benchmark/run_selective_routing_v3.py'
      - 'benchmark/aggregate_selective_routing_v3.py'
      - 'benchmark/routing_validation_v3/**'
      - 'docs/SELECTIVE_ROUTING_V3_PREREG.md'
      - '.github/workflows/reasoning-selective-routing-v3.yml'
      - '.github/workflows/selective-routing-v3-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/requirements.txt
      - name: Validate Python syntax
        run: |
          python -m py_compile \
            benchmark/selective_router_v3.py \
            benchmark/load_routing_validation_v3.py \
            benchmark/preflight_selective_routing_v3.py \
            benchmark/run_selective_routing_v3.py \
            benchmark/aggregate_selective_routing_v3.py
      - name: Validate fresh suite structure
        run: python benchmark/load_routing_validation_v3.py
      - name: Validate frozen v3 router blob
        run: test "$(git hash-object benchmark/selective_router_v3.py)" = "6ebb72e443c846aee35281c20e64f3b5d173a7a0"
      - name: Validate frozen configuration without network
        working-directory: benchmark
        env:
          ZAI_API_KEY: static-dummy
          ZAI_JUDGE_API_KEY: static-dummy
          ROUTER_V3_API_KEY: static-dummy
          ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
          ZAI_JUDGE_BASE_URL: https://api.z.ai/api/coding/paas/v4
          ROUTER_V3_BASE_URL: https://api.z.ai/api/coding/paas/v4
          ZAI_TARGET_MODEL: glm-5.1
          ZAI_JUDGE_MODEL: glm-5.3-flash
          ROUTER_V3_MODEL: glm-5.3-flash
          ROUTING_V3_SAME_FAMILY_ATTESTATION: 'true'
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          from preflight_selective_routing_v3 import validate_frozen_configuration
          x = validate_frozen_configuration()
          assert x['n_cases'] == 48
          assert len(x['suite_sha256']) == 64
          assert x['router_git_blob'] == '6ebb72e443c846aee35281c20e64f3b5d173a7a0'
          print(x)
          PY
      - name: Validate frozen thresholds and paired math
        working-directory: benchmark
        env:
          BENCHMARK_BOOTSTRAP_SAMPLES: '5000'
        run: |
          python - <<'PY'
          import aggregate_selective_routing_v3 as a
          assert a.FRAMEWORK_MIN_SCORE == 0.60
          assert a.BENEFIT_MIN_SCORE == 0.60
          assert a.QUALITY_CI_LOW_EXCLUSIVE == 0.50
          assert a.NONINFERIORITY_MARGIN == -0.05
          assert a.MAX_FULL_INVOCATION == 0.65
          d = {'a': -0.02, 'b': 0.0, 'c': -0.01, 'd': 0.01}
          s = a.summarize_delta(d, 'static-v3')
          assert abs(s['delta'] - (-0.005)) < 1e-12
          assert s['n_cases'] == 4
          PY
      - name: Validate workflow isolation and preregistration
        run: |
          python - <<'PY'
          from pathlib import Path
          runner = Path('benchmark/run_selective_routing_v3.py').read_text()
          workflow = Path('.github/workflows/reasoning-selective-routing-v3.yml').read_text()
          prereg = Path('docs/SELECTIVE_ROUTING_V3_PREREG.md').read_text()
          assert 'from preflight_selective_routing_v3 import validate_frozen_configuration' in runner
          assert 'connectivity()' not in runner
          assert '[run-selective-routing-v3]' in workflow
          assert 'max-parallel: 3' in workflow
          assert 'shard: [0, 1, 2, 3, 4, 5]' in workflow
          assert workflow.count('python preflight_selective_routing_v3.py') == 1
          assert 'ROUTING_V3_SHARD_INDEX:' in workflow
          assert 'routing_validation_v3/manifest.json' in prereg
          assert 'CI95_low(mean(D_i)) > -0.05' in prereg
          assert 'FULL invocation rate <= `0.65`' in prereg
          assert 'confidence is diagnostic only' in prereg
          PY

name: Absolute Behavior v0.10 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/run_v010.py'
      - 'benchmark/capability_cases_v010.json'
      - '.github/workflows/reasoning-absolute-behavior-v010.yml'
      - '.github/workflows/absolute-behavior-v010-check.yml'
      - 'docs/ABSOLUTE_BEHAVIOR_IDENTIFICATION_V0_10.md'
      - 'docs/SELECTIVE_CONTROL_V0_9_RESULTS.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and JSON
        run: |
          python -m py_compile run_v010.py
          python -m json.tool capability_cases_v010.json > /dev/null

      - name: Validate cases and frozen modules
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v010 as r
          import run_v06 as v06
          import run_v07 as v07

          assert len(r.CASES) == 4
          assert set(r.FAMILIES) == {'TEST', 'ENGINEER'}
          assert set(r.CONDITIONS) == {'CONTROL', 'ATTENTION', 'TARGET'}
          assert r.GENERATION_REPLICATES == 3
          assert r.BEHAVIOR_VOTES == 3
          assert r.QUALITY_VOTES == 3
          assert r.MANIPULATION_LIFT_GATE == 0.5
          assert r.CONTROL == v07.CORE
          assert r.ATTENTION == v07.ATTENTION
          assert r.TARGET_MODULES['TEST'] == v06.STAGE_ADDONS['TEST']
          assert r.TARGET_MODULES['ENGINEER'] == v07.TARGET_MODULES['ENGINEER']
          assert sum(c['family'] == 'TEST' for c in r.CASES) == 2
          assert sum(c['family'] == 'ENGINEER' for c in r.CASES) == 2
          assert len({c['case_id'] for c in r.CASES}) == 4

          forbidden = {
              'TEST': ['experiment', 'run a test', 'design a test', 'falsif'],
              'ENGINEER': ['engineer', 'reasoning framework', 'design an intervention'],
          }
          for case in r.CASES:
              prompt = ' '.join(t['agent_input'].lower() for t in case['turns'])
              assert case['evaluator_key']['target_behavior']
              for token in forbidden[case['family']]:
                  assert token not in prompt, (case['case_id'], token)

          print('v0.10 cases and frozen modules validated')
          PY

      - name: Validate independent absolute behavior judging
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import json
          import run_v010 as r

          captured = {}
          def fake_judge(system, messages):
              captured['system'] = system
              captured['messages'] = messages
              return {'text': '{"score": 2, "notes": "synthetic"}', 'usage': {}}

          r.v03.judge_call = fake_judge
          case = r.CASES[0]
          run = {
              'condition': 'CONTROL',
              'replicate': 1,
              'responses': [{'turn': t['turn'], 'text': 'synthetic response'} for t in case['turns']],
          }
          out = r.absolute_behavior_vote(case, run, 1)
          payload = json.loads(captured['messages'][0]['content'])
          assert out['score'] == 2.0
          assert set(payload) == {'case_id', 'target_behavior', 'response'}
          assert 'response_A' not in payload and 'response_B' not in payload
          assert 'A_score' not in captured['system'] and 'B_score' not in captured['system']
          print('v0.10 behavior judge sees exactly one response')
          PY

      - name: Validate nested behavior aggregation
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v010 as r

          votes = []
          for case in r.CASES:
              base = 2.0 if case['family'] == 'TEST' else 2.5
              scores = {'CONTROL': base, 'ATTENTION': base + 0.25, 'TARGET': base + 1.0}
              for condition, score in scores.items():
                  for replicate in range(1, 4):
                      for vote_index in range(1, 4):
                          votes.append({
                              'case_id': case['case_id'],
                              'family': case['family'],
                              'condition': condition,
                              'replicate': replicate,
                              'vote_index': vote_index,
                              'score': score,
                          })
          out = r.behavior_summary(votes)
          for family in r.FAMILIES:
              assert out[family]['target_minus_control'] == 1.0
              assert out[family]['target_minus_attention'] == 0.75
              assert out[family]['attention_minus_control'] == 0.25
              assert out[family]['identification_gate'] is True
              assert len(out[family]['case_means']) == 2
          print('v0.10 nested absolute behavior aggregation validated')
          PY

      - name: Validate quality aggregation
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v010 as r

          votes = []
          for case in r.CASES:
              for spec in r.PAIR_SPECS:
                  for replicate in range(1, 4):
                      for vote_index in range(1, 4):
                          votes.append({
                              'case_id': case['case_id'],
                              'family': case['family'],
                              'replicate': replicate,
                              'pair_id': spec['pair_id'],
                              'winner': spec['focal'],
                              'focal_score': 1.0,
                          })
          out = r.quality_summary(votes)
          for spec in r.PAIR_SPECS:
              result = out[spec['pair_id']]
              assert result['overall']['score'] == 1.0
              for family in r.FAMILIES:
                  assert result['by_family'][family]['score'] == 1.0
          print('v0.10 quality aggregation validated')
          PY

      - name: Smoke import
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: python -c "import run_v010; print('run_v010 import ok')"

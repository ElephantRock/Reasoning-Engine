name: Reasoning Benchmark Pilot

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: Z.AI target model ID
        required: true
        default: GLM-5.1
      judge_model:
        description: Z.AI evaluator model ID
        required: true
        default: GLM-5.1
      base_url:
        description: Z.AI OpenAI-compatible base URL
        required: true
        default: https://api.z.ai/api/coding/paas/v4

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_BASE_URL: ${{ inputs.base_url }}
      ZAI_TARGET_MODEL: ${{ inputs.target_model }}
      ZAI_JUDGE_MODEL: ${{ inputs.judge_model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Z.AI secret
        shell: bash
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "ZAI_API_KEY repository secret is required." >&2
            exit 1
          fi

      - name: Run blinded pilot through Z.AI
        run: python run_zai.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-benchmark-pilot-${{ github.run_id }}
          path: benchmark/results/
          if-no-files-found: warn
          retention-days: 30

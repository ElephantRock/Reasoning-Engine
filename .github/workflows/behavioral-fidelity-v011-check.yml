name: Behavioral Fidelity v0.11 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/run_v011.py'
      - 'benchmark/capability_cases_v011.json'
      - '.github/workflows/reasoning-behavioral-fidelity-v011.yml'
      - '.github/workflows/behavioral-fidelity-v011-check.yml'
      - 'docs/BEHAVIORAL_FIDELITY_V0_11.md'
      - 'docs/ABSOLUTE_BEHAVIOR_V0_10_RESULTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and JSON
        run: |
          python -m py_compile run_v011.py
          python -m json.tool capability_cases_v011.json > /dev/null

      - name: Validate cases, frozen modules, and fidelity criteria
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v011 as r
          import run_v010 as v010

          assert len(r.CASES) == 4
          assert set(r.FAMILIES) == {'TEST', 'ENGINEER'}
          assert set(r.CONDITIONS) == {'CONTROL', 'ATTENTION', 'TARGET'}
          assert r.GENERATION_REPLICATES == 3
          assert r.FIDELITY_VOTES == 3
          assert r.QUALITY_VOTES == 3
          assert r.FIDELITY_LIFT_GATE == 0.15
          assert r.CONTROL == v010.CONTROL
          assert r.ATTENTION == v010.ATTENTION
          assert r.TARGET_MODULES == v010.TARGET_MODULES

          for family in r.FAMILIES:
              family_cases = [c for c in r.CASES if c['family'] == family]
              assert len(family_cases) == 2
              ids0 = [x['id'] for x in family_cases[0]['evaluator_key']['fidelity_criteria']]
              assert len(ids0) == 5 and len(set(ids0)) == 5
              for case in family_cases:
                  criteria = case['evaluator_key']['fidelity_criteria']
                  assert [x['id'] for x in criteria] == ids0
                  assert all(x['text'].strip() for x in criteria)

          forbidden = {
              'TEST': [' test ', ' experiment ', ' falsif'],
              'ENGINEER': [' engineer', ' intervention '],
          }
          for case in r.CASES:
              prompt = (' ' + ' '.join(t['agent_input'].lower() for t in case['turns']) + ' ')
              for token in forbidden[case['family']]:
                  assert token not in prompt, (case['case_id'], token)

          print('v0.11 cases, frozen modules, and criteria validated')
          PY

      - name: Validate single-response fidelity judge and schema
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import inspect
          import run_v011 as r

          source = inspect.getsource(r.fidelity_vote)
          assert 'response_A' not in source
          assert 'response_B' not in source
          assert '"response": transcript(case, run)' in source
          assert 'Response A' not in r.FIDELITY_JUDGE
          assert 'Response B' not in r.FIDELITY_JUDGE
          assert 'exactly five observable criteria' in r.FIDELITY_JUDGE
          assert '0.0 = absent' in r.FIDELITY_JUDGE
          assert '0.5 = partial' in r.FIDELITY_JUDGE
          assert '1.0 = clear' in r.FIDELITY_JUDGE
          print('v0.11 fidelity judge is single-response and criterion-decomposed')
          PY

      - name: Validate nested fidelity aggregation and gate
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: |
          python - <<'PY'
          import run_v011 as r

          votes = []
          for case in r.CASES:
              ids = [x['id'] for x in case['evaluator_key']['fidelity_criteria']]
              for condition, score in [('CONTROL', 0.5), ('ATTENTION', 0.5), ('TARGET', 1.0)]:
                  for rep in range(1, 4):
                      for vote in range(1, 4):
                          votes.append({
                              'case_id': case['case_id'],
                              'family': case['family'],
                              'condition': condition,
                              'replicate': rep,
                              'vote_index': vote,
                              'criterion_scores': {cid: score for cid in ids},
                              'composite': score,
                          })

          out = r.fidelity_summary(votes)
          for family in r.FAMILIES:
              assert out[family]['condition_means']['CONTROL'] == 0.5
              assert out[family]['condition_means']['TARGET'] == 1.0
              assert out[family]['target_minus_control'] == 0.5
              assert out[family]['identification_gate'] is True
              assert all(
                  abs(x['target_minus_control'] - 0.5) < 1e-12
                  for x in out[family]['criterion_deltas'].values()
              )

          # One high judge vote must be averaged within the exact response, not counted as a new case.
          modified = [dict(v) for v in votes]
          first = modified[0]
          first['composite'] = 1.0
          first['criterion_scores'] = {k: 1.0 for k in first['criterion_scores']}
          out2 = r.fidelity_summary(modified)
          assert out2['TEST']['condition_means']['CONTROL'] < 0.53
          print('v0.11 nested fidelity aggregation validated')
          PY

      - name: Validate paid workflow size and gate
        run: |
          grep -q "V011_GENERATION_REPLICATES:.*'3'" ../.github/workflows/reasoning-behavioral-fidelity-v011.yml
          grep -q "V011_FIDELITY_VOTES:.*'3'" ../.github/workflows/reasoning-behavioral-fidelity-v011.yml
          grep -q "V011_QUALITY_VOTES:.*'3'" ../.github/workflows/reasoning-behavioral-fidelity-v011.yml
          grep -q "V011_FIDELITY_LIFT_GATE: '0.15'" ../.github/workflows/reasoning-behavioral-fidelity-v011.yml
          grep -q "timeout-minutes: 300" ../.github/workflows/reasoning-behavioral-fidelity-v011.yml

      - name: Smoke import
        env:
          OPENAI_API_KEY: unused-provider-shim
          ZAI_API_KEY: unused-zai-shim
          BENCHMARK_SUITE: combined
        run: python -c "import run_v011; print('run_v011 import ok')"

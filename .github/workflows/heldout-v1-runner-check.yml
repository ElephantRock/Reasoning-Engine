name: Held-Out Validation v1 Runner Static Check

on:
  pull_request:
    paths:
      - 'benchmark/run_heldout_v1.py'
      - 'benchmark/aggregate_heldout_v1.py'
      - '.github/workflows/reasoning-heldout-validation-v1.yml'
      - '.github/workflows/heldout-v1-runner-check.yml'
      - 'benchmark/heldout_candidate_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      OPENAI_API_KEY: unused-provider-shim
      ZAI_API_KEY: unused-target-shim
      ZAI_JUDGE_API_KEY: unused-judge-shim
      ZAI_TARGET_MODEL: glm-5.1
      ZAI_JUDGE_MODEL: independent-static-judge
      ZAI_BASE_URL: https://target.invalid/v1
      ZAI_JUDGE_BASE_URL: https://judge.invalid/v1
      HELDOUT_TARGET_FAMILY: glm
      HELDOUT_JUDGE_FAMILY: independent-family
      HELDOUT_INDEPENDENT_EVALUATOR_ATTESTATION: 'true'
      HELDOUT_GENERATION_REPLICATES: '3'
      HELDOUT_JUDGE_VOTES: '3'
      HELDOUT_SHARD_COUNT: '6'
      HELDOUT_SHARD_INDEX: '0'
      BENCHMARK_SUITE: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile run_heldout_v1.py aggregate_heldout_v1.py

      - name: Validate frozen design and no candidate leakage
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import run_heldout_v1 as r

          assert not Path('heldout_candidate_v1.json').exists(), 'runner scaffold must not preselect the v0.11 candidate'
          assert len(r.CASES) == 36
          assert Counter(c['routing_stratum'] for c in r.CASES) == Counter({'TEST': 9, 'ENGINEER': 9, 'BOTH': 6, 'NONE': 12})
          assert r.GENERATION_REPLICATES == 3
          assert r.JUDGE_VOTES == 3
          assert r.SHARD_COUNT == 6
          assert set(r.CONDITIONS) == {'CONTROL', 'ATTENTION', 'CANDIDATE_POLICY', 'FULL'}
          assert [s['pair_id'] for s in r.PAIR_SPECS] == [
              'CANDIDATE_POLICY_vs_CONTROL',
              'CANDIDATE_POLICY_vs_ATTENTION',
              'FULL_vs_CONTROL',
          ]
          assert r.FROZEN_MODULES['TEST'] == r.v06.STAGE_ADDONS['TEST']
          assert r.FROZEN_MODULES['ENGINEER'] == r.v07.TARGET_MODULES['ENGINEER']
          print('frozen held-out runner design validated')
          PY

      - name: Validate candidate gate and exact frozen hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import run_heldout_v1 as r

          try:
              r.load_candidate()
          except RuntimeError as exc:
              assert 'does not exist' in str(exc)
          else:
              raise AssertionError('missing candidate must fail')

          candidate = {
              'candidate_version': 'heldout-v1-frozen-candidate',
              'source_v011_run_id': 34182916670,
              'decision_protocol_commit': 'c29ab7766f01e3345f2e01ccb0b2969555138e5f',
              'selected_modules': ['TEST', 'ENGINEER'],
              'module_sha256': {k: r.sha256_text(r.FROZEN_MODULES[k]) for k in ['TEST', 'ENGINEER']},
              'selection_record': {'static_test': True},
          }
          path = Path('heldout_candidate_v1.json')
          path.write_text(json.dumps(candidate), encoding='utf-8')
          try:
              loaded = r.load_candidate()
              assert loaded['selected_modules'] == ['TEST', 'ENGINEER']
              test_case = next(c for c in r.CASES if c['routing_stratum'] == 'TEST')
              eng_case = next(c for c in r.CASES if c['routing_stratum'] == 'ENGINEER')
              both_case = next(c for c in r.CASES if c['routing_stratum'] == 'BOTH')
              none_case = next(c for c in r.CASES if c['routing_stratum'] == 'NONE')
              assert r.selected_modules_for_case(test_case, loaded) == ['TEST']
              assert r.selected_modules_for_case(eng_case, loaded) == ['ENGINEER']
              assert r.selected_modules_for_case(both_case, loaded) == ['TEST', 'ENGINEER']
              assert r.selected_modules_for_case(none_case, loaded) == []
              assert r.candidate_system(none_case, loaded) == r.CONTROL
          finally:
              path.unlink()
          print('candidate gate and frozen hashes validated')
          PY

      - name: Validate independent evaluator preflight
        run: |
          python - <<'PY'
          import os
          import run_heldout_v1 as r

          r.independent_evaluator_preflight()
          original_family = r.JUDGE_FAMILY
          r.JUDGE_FAMILY = r.TARGET_FAMILY
          try:
              r.independent_evaluator_preflight()
          except RuntimeError as exc:
              assert 'independent evaluator required' in str(exc)
          else:
              raise AssertionError('same-family evaluator must fail')
          finally:
              r.JUDGE_FAMILY = original_family

          old = os.environ.pop('ZAI_JUDGE_API_KEY')
          try:
              r.independent_evaluator_preflight()
          except RuntimeError as exc:
              assert 'ZAI_JUDGE_API_KEY' in str(exc)
          else:
              raise AssertionError('missing separate judge key must fail')
          finally:
              os.environ['ZAI_JUDGE_API_KEY'] = old
          print('independent evaluator preflight validated')
          PY

      - name: Validate aggregation thresholds
        run: |
          python - <<'PY'
          import aggregate_heldout_v1 as a
          assert a.PRIMARY_MIN_SCORE == 0.60
          assert a.PRIMARY_CI_LOW_MIN_EXCLUSIVE == 0.50
          assert a.SPECIFICITY_MIN_SCORE == 0.55
          assert a.STRATUM_HARM_FLOOR == 0.45
          assert a.EXPECTED_RUNS == 432
          assert a.EXPECTED_VOTES == 972
          print('held-out aggregation thresholds validated')
          PY

      - name: Validate workflow is manual, sharded, and preflight-gated
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/reasoning-heldout-validation-v1.yml').read_text()
          assert 'workflow_dispatch:' in text
          assert '\npush:' not in text
          assert 'matrix:\n        shard: [0, 1, 2, 3, 4, 5]' in text
          assert 'max-parallel: 3' in text
          assert 'needs: validate-preflight' in text
          assert 'ZAI_JUDGE_API_KEY' in text
          assert 'independent_evaluator_attestation' in text
          assert 'Aggregate case-clustered validation result' in text
          assert '[run-heldout-v1]' not in text
          print('manual sharded held-out workflow validated')
          PY

      - name: Smoke imports
        run: python -c "import run_heldout_v1, aggregate_heldout_v1; print('held-out runner imports ok')"

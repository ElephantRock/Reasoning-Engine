name: Routing v0.4 Static Check

on:
  pull_request:
    paths:
      - 'benchmark/run_v04.py'
      - 'benchmark/routing_holdout_v04.json'
      - '.github/workflows/reasoning-routing-v04.yml'
      - '.github/workflows/routing-v04-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install -r benchmark/requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile benchmark/run_v04.py

      - name: Validate held-out JSON
        run: python -m json.tool benchmark/routing_holdout_v04.json >/dev/null

      - name: Validate held-out structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = json.loads(Path('benchmark/routing_holdout_v04.json').read_text())
          assert len(cases) == 6, len(cases)
          assert [c['case_id'] for c in cases] == [f'RF-H0{i}' for i in range(1, 7)]
          for c in cases:
              assert c['expected_mode'] in {'DIRECT', 'COMPACT', 'FULL'}
              assert c['turns']
              assert c['evaluation_profile']['protocol_dimensions']
              assert c['evaluation_profile']['outcome_dimensions']
              assert c['evaluator_key']['acceptable_interventions']
              for t in c['turns']:
                  assert t['agent_input']
                  assert 'judge_reference' in t
          print('validated', len(cases), 'v0.4 held-out cases')
          PY

      - name: Smoke-import v0.4 runner
        env:
          OPENAI_API_KEY: dummy
          ZAI_API_KEY: dummy
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'benchmark')
          import run_v04
          assert len(run_v04.CASES) == 6
          print('v0.4 runner import succeeded')
          PY

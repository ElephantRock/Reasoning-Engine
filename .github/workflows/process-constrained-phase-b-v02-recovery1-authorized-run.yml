name: Process-Constrained Phase B v0.2 Recovery 1 Authorized Run

on:
  push:
    branches:
      - run/process-constrained-phase-b-v02-recovery1
    paths:
      - '.github/workflows/process-constrained-phase-b-v02-recovery1-authorized-run.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: process-constrained-phase-b-v02-recovery1-paid
  cancel-in-progress: false

env:
  ZAI_TARGET_MODEL: glm-5.1
  ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
  ZAI_TEMPERATURE: 0
  ZAI_MAX_TOKENS: 16384
  PHASE_B_ENFORCE_RUNTIME_ENV: 1
  PHASE_B_V02_RECOVERY1_AUTHORIZED: 1
  PHASE_B_V02_RECOVERY1_SOURCE_RUNS: ${{ github.workspace }}/recovery_source/runs.jsonl
  PHASE_B_V02_RECOVERY1_SOURCE_SHA: ba6744b21abe92d477780dd74ef70e36af6defc2
  PHASE_B_V02_SOURCE_ARTIFACT_ID: 10422887717
  PHASE_B_V02_SOURCE_RUNS_SHA256: 23887fab0915ad8c727cd2d817b6015e9fe188d8c0fd75f92caf0f522f3c2843

jobs:
  run:
    if: github.ref == 'refs/heads/run/process-constrained-phase-b-v02-recovery1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout exact reviewed Recovery 1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ba6744b21abe92d477780dd74ef70e36af6defc2
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reviewed Recovery 1 revision
        run: |
          test "$(git rev-parse HEAD)" = "$PHASE_B_V02_RECOVERY1_SOURCE_SHA"
          echo "Recovery 1 source $PHASE_B_V02_RECOVERY1_SOURCE_SHA verified"
      - name: Enforce Recovery 1 one-shot boundary
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          if int(os.environ['CURRENT_RUN_ATTEMPT']) != 1:
              raise SystemExit('Recovery 1 reruns are not authorized; freeze Recovery 2 instead')

          run_id = int(os.environ['CURRENT_RUN_ID'])
          repo = os.environ['REPOSITORY']
          workflow = urllib.parse.quote('process-constrained-phase-b-v02-recovery1-authorized-run.yml', safe='')
          branch = urllib.parse.quote('run/process-constrained-phase-b-v02-recovery1', safe='')
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs'
              f'?event=push&branch={branch}&per_page=100'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          data = None
          for _ in range(10):
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              ids = [int(item['id']) for item in data.get('workflow_runs', [])]
              if run_id in ids:
                  break
              time.sleep(2)
          else:
              raise SystemExit('current Recovery 1 run was not visible to the one-shot check')
          if int(data.get('total_count', 0)) > 100:
              raise SystemExit('too many Recovery 1 dispatches to establish one-shot status')
          ids = [int(item['id']) for item in data.get('workflow_runs', [])]
          if not ids or run_id != min(ids):
              prior = min(ids) if ids else 'unknown'
              raise SystemExit(f'Recovery 1 authorization already consumed by run {prior}')
          print(f'Recovery 1 one-shot authorization accepted for run {run_id}')
          PY
      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: benchmark/requirements_process_phase_b_v02.txt
      - name: Install frozen dependencies
        run: python -m pip install -r requirements_process_phase_b_v02.txt
      - name: Download frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/recovery_source"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$PHASE_B_V02_SOURCE_ARTIFACT_ID/zip" \
            -o "$GITHUB_WORKSPACE/recovery_source/source.zip"
          unzip -q "$GITHUB_WORKSPACE/recovery_source/source.zip" -d "$GITHUB_WORKSPACE/recovery_source/unpacked"
          cp "$GITHUB_WORKSPACE/recovery_source/unpacked/runs.jsonl" "$GITHUB_WORKSPACE/recovery_source/runs.jsonl"
      - name: Validate frozen source artifact before provider calls
        run: |
          test "$(sha256sum "$PHASE_B_V02_RECOVERY1_SOURCE_RUNS" | awk '{print $1}')" = "$PHASE_B_V02_SOURCE_RUNS_SHA256"
          python - <<'PY'
          import os
          from pathlib import Path
          import recover_process_phase_b_v02_r1 as recovery
          source = Path(os.environ['PHASE_B_V02_RECOVERY1_SOURCE_RUNS'])
          rows, lines = recovery.load_source_runs(source)
          assert len(rows) == 5
          assert len(lines) == 5
          print('frozen five-record source artifact verified')
          PY
      - name: Re-run complete zero-cost Recovery 1 validation before provider calls
        env:
          ZAI_API_KEY: ''
          PHASE_B_V02_RECOVERY1_AUTHORIZED: '0'
        run: |
          python process_phase_b_suite_v02.py
          python - <<'PY'
          import recover_process_phase_b_v02_r1 as recovery
          recovery.validate_recovery_design()
          print('Recovery 1 design validated')
          PY
          python -m unittest -v \
            test_process_phase_b_v02_corrections.py \
            test_process_phase_b_runner_v02.py \
            test_process_phase_b_v02_final_review.py \
            test_process_phase_b_v02_recovery1.py
      - name: Run frozen Process-Constrained Phase B v0.2 Recovery 1
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          PHASE_B_V02_RECOVERY1_AUTHORIZED: '1'
        run: python recover_process_phase_b_v02_r1.py
      - name: Show result summary or interruption metadata
        if: always()
        run: |
          if [ -f results_process_phase_b_v02_recovery1/summary.json ]; then
            cat results_process_phase_b_v02_recovery1/summary.json
          fi
          if [ -f results_process_phase_b_v02_recovery1/partial_meta.json ]; then
            cat results_process_phase_b_v02_recovery1/partial_meta.json
          fi
          if [ -f results_process_phase_b_v02_recovery1/recovery_meta.json ]; then
            cat results_process_phase_b_v02_recovery1/recovery_meta.json
          fi
      - name: Record execution environment
        if: always()
        run: |
          mkdir -p results_process_phase_b_v02_recovery1
          python --version > results_process_phase_b_v02_recovery1/runtime_environment.txt || true
          python -m pip freeze >> results_process_phase_b_v02_recovery1/runtime_environment.txt || true
          printf '\nRUNNER_IMAGE=%s\nRECOVERY_SOURCE_SHA=%s\nSOURCE_ARTIFACT_ID=%s\nSOURCE_RUNS_SHA256=%s\nAUTHORIZED_RUN_ID=%s\nAUTHORIZED_RUN_ATTEMPT=%s\nAUTHORIZATION_PATH=chat-explicit-recovery-continuation\n' \
            "${ImageOS:-unknown}" "$PHASE_B_V02_RECOVERY1_SOURCE_SHA" "$PHASE_B_V02_SOURCE_ARTIFACT_ID" "$PHASE_B_V02_SOURCE_RUNS_SHA256" "${{ github.run_id }}" "${{ github.run_attempt }}" \
            >> results_process_phase_b_v02_recovery1/runtime_environment.txt || true
      - name: Upload Phase B v0.2 Recovery 1 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-constrained-phase-b-v02-recovery1-results
          path: benchmark/results_process_phase_b_v02_recovery1/
          if-no-files-found: warn
          retention-days: 30

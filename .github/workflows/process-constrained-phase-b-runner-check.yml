name: Process-Constrained Phase B Runner Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Phase B runner
        run: |
          python -m py_compile \
            protocol_runtime_v03.py protocol_environments_v03.py process_phase_b_suite_v01.py \
            run_process_phase_b_v01.py run_process_phase_b_v01_exec.py run_process_phase_b_v01_reviewed.py \
            test_process_phase_b_runner_v01.py test_process_phase_b_blinding_v01.py
      - name: Validate zero-cost environment preflight
        run: |
          python process_phase_b_suite_v01.py
          python -m unittest -v test_process_phase_b_preflight_v01.py test_matched_scaffold_actions_v01.py
      - name: Run zero-cost runner tests with no provider key
        env:
          ZAI_API_KEY: ''
          ZAI_TARGET_MODEL: glm-5.1
        run: |
          python -m unittest -v test_process_phase_b_runner_v01.py test_process_phase_b_blinding_v01.py
      - name: Validate paid-workflow authorization boundary when present
        run: |
          if [ -f ../.github/workflows/process-constrained-phase-b-v01-paid.yml ]; then
            test -f process_phase_b_freeze_v01.json
            test -f validate_process_phase_b_freeze_v01.py
            python - <<'PY'
          from pathlib import Path
          text = Path('../.github/workflows/process-constrained-phase-b-v01-paid.yml').read_text()
          assert 'workflow_dispatch:' in text
          assert 'pull_request:' not in text
          assert 'push:' not in text
          assert 'validate_process_phase_b_freeze_v01.py' in text
          assert 'run_process_phase_b_v01_reviewed.py' in text
          print('paid workflow is manual and freeze-gated')
          PY
          else
            echo 'no paid Phase B workflow present'
          fi

name: Process-Constrained Phase B v0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-constrained-phase-b-v01-paid
  cancel-in-progress: false

env:
  OPENAI_API_KEY: unused-provider-shim
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  ZAI_TARGET_MODEL: glm-5.1
  ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
  ZAI_TEMPERATURE: 0
  ZAI_MAX_TOKENS: 16384
  PHASE_B_ENFORCE_RUNTIME_ENV: 1

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: benchmark/requirements_process_phase_b_v01.txt
      - name: Install frozen dependencies
        run: python -m pip install -r requirements_process_phase_b_v01.txt
      - name: Validate frozen artifacts and runtime configuration
        run: python validate_process_phase_b_freeze_v01.py
      - name: Re-run zero-cost preflight before paid calls
        run: |
          python process_phase_b_suite_v01.py
          python -m unittest -v \
            test_process_phase_b_preflight_v01.py \
            test_matched_scaffold_actions_v01.py \
            test_process_phase_b_runner_v01.py \
            test_process_phase_b_blinding_v01.py
      - name: Run frozen Process-Constrained Phase B v0.1
        run: python run_process_phase_b_v01_reviewed.py
      - name: Show result summary or interruption metadata
        if: always()
        run: |
          if [ -f results_process_phase_b_v01/summary.json ]; then
            cat results_process_phase_b_v01/summary.json
          fi
          if [ -f results_process_phase_b_v01/partial_meta.json ]; then
            cat results_process_phase_b_v01/partial_meta.json
          fi
      - name: Record execution environment
        if: always()
        run: |
          python --version > results_process_phase_b_v01/runtime_environment.txt || true
          python -m pip freeze >> results_process_phase_b_v01/runtime_environment.txt || true
          printf '\nRUNNER_IMAGE=%s\n' "${ImageOS:-unknown}" >> results_process_phase_b_v01/runtime_environment.txt || true
      - name: Upload Phase B artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-constrained-phase-b-v01-results
          path: benchmark/results_process_phase_b_v01/
          if-no-files-found: warn
          retention-days: 30

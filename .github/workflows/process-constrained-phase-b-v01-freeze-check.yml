name: Process-Constrained Phase B Freeze Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen Git blobs
        run: python validate_process_phase_b_freeze_v01.py
      - name: Validate paid workflow safety and reproducibility boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          frozen_source = 'febffa5c9bd277136a78bfaa02aa365ee04a11b1'
          text = Path('../.github/workflows/process-constrained-phase-b-v01-paid.yml').read_text()
          required = [
              'workflow_dispatch:',
              'actions: read',
              "if: github.ref == 'refs/heads/main'",
              f'PHASE_B_FROZEN_SOURCE_SHA: {frozen_source}',
              f'ref: {frozen_source}',
              'persist-credentials: false',
              'git rev-parse HEAD',
              'CURRENT_RUN_ID:',
              'github.run_id',
              'CURRENT_RUN_ATTEMPT:',
              'github.run_attempt',
              'run_attempt != 1',
              'actions/workflows/{workflow}/runs',
              'event=workflow_dispatch&branch=main&per_page=100',
              'run_id != min(ids)',
              'ZAI_TARGET_MODEL: glm-5.1',
              'ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4',
              'ZAI_TEMPERATURE: 0',
              'ZAI_MAX_TOKENS: 16384',
              "python-version: '3.12.14'",
              'requirements_process_phase_b_v01.txt',
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
              'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'run_process_phase_b_v01_reviewed.py',
              'validate_process_phase_b_freeze_v01.py',
          ]
          for item in required:
              assert item in text, item
          assert 'pull_request:' not in text
          assert 'push:' not in text
          top_level = text.split('\njobs:', 1)[0]
          assert 'ZAI_API_KEY' not in top_level
          assert 'ZAI_API_KEY:' in text
          assert 'secrets.ZAI_API_KEY' in text

          lock = Path('requirements_process_phase_b_v01.txt').read_text()
          assert 'openai==3.13.0' in lock
          assert 'openai>=' not in lock

          manifest = json.loads(Path('process_phase_b_freeze_v01.json').read_text())
          assert '.github/workflows/process-constrained-phase-b-v01-paid.yml' not in manifest['files']
          assert manifest['execution_order']['condition_order'] == 'family_balanced_cyclic_rotation_v1'
          assert manifest['execution_order']['within_family_position_count_range'] == [1, 2]
          assert manifest['execution_order']['global_position_count_per_condition'] == 6
          assert 'one authorized main dispatch' in manifest['orchestrator_boundary']
          print('paid workflow one-shot/main-only/exact-source safety boundary validated')
          PY
      - name: Validate exact frozen source snapshot
        run: |
          frozen=febffa5c9bd277136a78bfaa02aa365ee04a11b1
          git cat-file -e "${frozen}^{commit}"
          rm -rf /tmp/phase-b-frozen
          git worktree add --detach /tmp/phase-b-frozen "$frozen"
          (cd /tmp/phase-b-frozen/benchmark && python validate_process_phase_b_freeze_v01.py)
          (cd /tmp/phase-b-frozen/benchmark && python -m unittest -v test_process_phase_b_blinding_v01.py)
          git worktree remove /tmp/phase-b-frozen
      - name: Run complete zero-cost validation suite
        env:
          ZAI_API_KEY: ''
          ZAI_TARGET_MODEL: glm-5.1
        run: |
          python process_phase_b_suite_v01.py
          python -m unittest -v \
            test_process_phase_b_preflight_v01.py \
            test_matched_scaffold_actions_v01.py \
            test_process_phase_b_runner_v01.py \
            test_process_phase_b_blinding_v01.py

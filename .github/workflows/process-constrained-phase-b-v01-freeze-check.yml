name: Process-Constrained Phase B Freeze Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen Git blobs
        run: python validate_process_phase_b_freeze_v01.py
      - name: Validate paid workflow safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('../.github/workflows/process-constrained-phase-b-v01-paid.yml').read_text()
          assert 'workflow_dispatch:' in text
          assert 'pull_request:' not in text
          assert 'push:' not in text
          assert 'ZAI_TARGET_MODEL: glm-5.1' in text
          assert 'ZAI_TEMPERATURE: 0' in text
          assert 'ZAI_MAX_TOKENS: 16384' in text
          assert 'run_process_phase_b_v01_reviewed.py' in text
          assert 'validate_process_phase_b_freeze_v01.py' in text
          print('paid workflow safety configuration validated')
          PY
      - name: Run complete zero-cost validation suite
        env:
          ZAI_API_KEY: ''
          ZAI_TARGET_MODEL: glm-5.1
        run: |
          python process_phase_b_suite_v01.py
          python -m unittest -v \
            test_process_phase_b_preflight_v01.py \
            test_matched_scaffold_actions_v01.py \
            test_process_phase_b_runner_v01.py \
            test_process_phase_b_blinding_v01.py

name: Reasoning Held-Out Validation v1

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: Frozen target model ID
        required: true
        default: glm-5.1
        type: string
      target_family:
        description: Target model family identifier
        required: true
        default: glm
        type: string
      judge_model:
        description: Independent judge model ID (must differ from target)
        required: true
        type: string
      judge_family:
        description: Independent judge model family (must differ from target family)
        required: true
        type: string
      judge_base_url:
        description: OpenAI-compatible endpoint for the independent judge
        required: true
        type: string
      independent_evaluator_attestation:
        description: I attest that the judge is from a model family/provider independent of target generation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
  ZAI_TARGET_MODEL: ${{ inputs.target_model }}
  HELDOUT_TARGET_FAMILY: ${{ inputs.target_family }}
  ZAI_JUDGE_MODEL: ${{ inputs.judge_model }}
  ZAI_JUDGE_BASE_URL: ${{ inputs.judge_base_url }}
  HELDOUT_JUDGE_FAMILY: ${{ inputs.judge_family }}
  HELDOUT_INDEPENDENT_EVALUATOR_ATTESTATION: ${{ inputs.independent_evaluator_attestation }}
  HELDOUT_GENERATION_REPLICATES: '3'
  HELDOUT_JUDGE_VOTES: '3'
  HELDOUT_SHARD_COUNT: '6'
  BENCHMARK_BOOTSTRAP_SAMPLES: '5000'
  BENCHMARK_SUITE: combined

jobs:
  validate-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.ZAI_JUDGE_API_KEY }}
    steps:
      - name: Checkout frozen validation commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify candidate and evaluator before any model call
        shell: bash
        run: |
          test -f heldout_candidate_v1.json || {
            echo 'heldout_candidate_v1.json is required and must be selected mechanically from v0.11.' >&2
            exit 1
          }
          test -n "$ZAI_API_KEY" || {
            echo 'ZAI_API_KEY is required.' >&2
            exit 1
          }
          test -n "$ZAI_JUDGE_API_KEY" || {
            echo 'A separate ZAI_JUDGE_API_KEY is required; target-key fallback is forbidden.' >&2
            exit 1
          }
          test "$HELDOUT_INDEPENDENT_EVALUATOR_ATTESTATION" = 'true' || {
            echo 'Independent-evaluator attestation must be true.' >&2
            exit 1
          }
          test "$ZAI_TARGET_MODEL" != "$ZAI_JUDGE_MODEL" || {
            echo 'Judge model ID must differ from target model ID.' >&2
            exit 1
          }
          test "${HELDOUT_TARGET_FAMILY,,}" != "${HELDOUT_JUDGE_FAMILY,,}" || {
            echo 'Judge model family must differ from target family.' >&2
            exit 1
          }
          python - <<'PY'
          import run_heldout_v1 as r
          candidate = r.load_candidate()
          r.independent_evaluator_preflight()
          assert len(r.CASES) == 36
          assert r.GENERATION_REPLICATES == 3
          assert r.JUDGE_VOTES == 3
          print('held-out v1 preflight passed; selected modules:', candidate['selected_modules'])
          PY

  run-shards:
    needs: validate-preflight
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.ZAI_JUDGE_API_KEY }}
      HELDOUT_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout frozen validation commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run held-out shard
        run: python run_heldout_v1.py

      - name: Upload raw shard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v1-shard-${{ matrix.shard }}
          path: |
            benchmark/results_heldout_v1/heldout_v1_runs_shard_${{ matrix.shard }}.jsonl
            benchmark/results_heldout_v1/heldout_v1_votes_shard_${{ matrix.shard }}.jsonl
            benchmark/results_heldout_v1/heldout_v1_meta_shard_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: run-shards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    env:
      OPENAI_API_KEY: unused-aggregation-shim
      ZAI_API_KEY: unused-aggregation-shim
      ZAI_JUDGE_API_KEY: unused-aggregation-shim
      HELDOUT_TARGET_FAMILY: ${{ inputs.target_family }}
      HELDOUT_JUDGE_FAMILY: ${{ inputs.judge_family }}
    steps:
      - name: Checkout frozen validation commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: heldout-v1-shard-*
          merge-multiple: true
          path: benchmark/results_heldout_v1

      - name: Aggregate case-clustered validation result
        run: python aggregate_heldout_v1.py

      - name: Upload final held-out validation report
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-heldout-validation-v1-${{ github.run_id }}
          path: |
            benchmark/results_heldout_v1/heldout_v1_report.json
            benchmark/results_heldout_v1/heldout_v1_runs_shard_*.jsonl
            benchmark/results_heldout_v1/heldout_v1_votes_shard_*.jsonl
            benchmark/results_heldout_v1/heldout_v1_meta_shard_*.json
          if-no-files-found: error
          retention-days: 90

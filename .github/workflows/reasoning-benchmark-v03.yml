name: Reasoning Benchmark Measurement v0.3

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite (stress recommended first)
        required: true
        type: choice
        options:
          - stress
          - pilot
          - combined
        default: stress
      replicates:
        description: Stochastic replicates per case/condition
        required: true
        default: '1'
      target_model:
        description: Z.AI target model ID
        required: true
        default: glm-5.1
      judge_model:
        description: Z.AI evaluator model ID (use a different model when available)
        required: true
        default: glm-5.1
      target_base_url:
        description: Target OpenAI-compatible base URL
        required: true
        default: https://api.z.ai/api/coding/paas/v4
      judge_base_url:
        description: Judge OpenAI-compatible base URL
        required: true
        default: https://api.z.ai/api/coding/paas/v4

permissions:
  contents: read

jobs:
  measurement-v03:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.ZAI_JUDGE_API_KEY }}
      ZAI_BASE_URL: ${{ inputs.target_base_url }}
      ZAI_JUDGE_BASE_URL: ${{ inputs.judge_base_url }}
      ZAI_TARGET_MODEL: ${{ inputs.target_model }}
      ZAI_JUDGE_MODEL: ${{ inputs.judge_model }}
      BENCHMARK_SUITE: ${{ inputs.suite }}
      BENCHMARK_REPLICATES: ${{ inputs.replicates }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify target secret
        shell: bash
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "ZAI_API_KEY repository secret is required." >&2
            exit 1
          fi
          if ! [[ "$BENCHMARK_REPLICATES" =~ ^[1-9][0-9]*$ ]]; then
            echo "replicates must be a positive integer." >&2
            exit 1
          fi
          if [ -z "$ZAI_JUDGE_API_KEY" ]; then
            echo "ZAI_JUDGE_API_KEY is not set; evaluator will fall back to ZAI_API_KEY."
          fi
          if [ "$ZAI_TARGET_MODEL" = "$ZAI_JUDGE_MODEL" ] && [ "$ZAI_BASE_URL" = "$ZAI_JUDGE_BASE_URL" ]; then
            echo "WARNING: target and judge use the same model/endpoint; pairwise results are useful but not evaluator-independent."
          fi

      - name: Run measurement v0.3
        run: python run_v03.py

      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-benchmark-v03-${{ github.run_id }}
          path: benchmark/results_v03/
          if-no-files-found: warn
          retention-days: 30

name: Reasoning Capability Identification v0.8

on:
  workflow_dispatch:
    inputs:
      screen_replicates:
        description: CONTROL generations per candidate during Stage 1 screening
        required: true
        default: '2'
      test_replicates:
        description: Fresh generations per selected case/condition during Stage 2
        required: true
        default: '3'
      judge_votes:
        description: Odd blinded behavior/quality votes per generated response or pair
        required: true
        default: '3'
      target_model:
        description: Z.AI target model ID
        required: true
        default: glm-5.1
      judge_model:
        description: Z.AI evaluator model ID
        required: true
        default: glm-5.1
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capability-identification-v08:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v08-capability]')
    runs-on: ubuntu-latest
    timeout-minutes: 480
    defaults:
      run:
        working-directory: benchmark
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ZAI_JUDGE_API_KEY: ${{ secrets.ZAI_JUDGE_API_KEY }}
      ZAI_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_JUDGE_BASE_URL: https://api.z.ai/api/coding/paas/v4
      ZAI_TARGET_MODEL: ${{ inputs.target_model || 'glm-5.1' }}
      ZAI_JUDGE_MODEL: ${{ inputs.judge_model || 'glm-5.1' }}
      ZAI_JUDGE_TEMPERATURE: '0.2'
      V08_SCREEN_REPLICATES: ${{ inputs.screen_replicates || '2' }}
      V08_TEST_REPLICATES: ${{ inputs.test_replicates || '3' }}
      V08_JUDGE_VOTES: ${{ inputs.judge_votes || '3' }}
      V08_SCREEN_MAX_CONTROL: '2.5'
      V08_MIN_HEADROOM: '1.0'
      V08_SELECT_PER_FAMILY: '3'
      V08_MIN_SELECTED: '2'
      V08_MANIPULATION_LIFT_GATE: '0.5'
      BENCHMARK_SUITE: combined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify experiment configuration
        shell: bash
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "ZAI_API_KEY repository secret is required." >&2
            exit 1
          fi
          for value in "$V08_SCREEN_REPLICATES" "$V08_TEST_REPLICATES" "$V08_JUDGE_VOTES" "$V08_SELECT_PER_FAMILY" "$V08_MIN_SELECTED"; do
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "replicate/vote/selection settings must be positive integers." >&2
              exit 1
            fi
          done
          if [ "$V08_SCREEN_REPLICATES" -ne 2 ] || [ "$V08_TEST_REPLICATES" -ne 3 ]; then
            echo "WARNING: preregistered development run uses 2 screening and 3 fresh test replicates."
          fi
          if [ "$V08_JUDGE_VOTES" -lt 3 ] || [ $((V08_JUDGE_VOTES % 2)) -eq 0 ]; then
            echo "judge votes must be an odd integer >= 3." >&2
            exit 1
          fi
          if [ -z "$ZAI_JUDGE_API_KEY" ]; then
            echo "ZAI_JUDGE_API_KEY is not set; evaluator will fall back to ZAI_API_KEY."
          fi
          if [ "$ZAI_TARGET_MODEL" = "$ZAI_JUDGE_MODEL" ]; then
            echo "WARNING: same target/judge model; this is development identification, not evaluator-independent validation."
          fi

      - name: Run two-stage capability identification v0.8
        run: python run_v08.py

      - name: Upload v0.8 diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-capability-v08-${{ github.run_id }}
          path: benchmark/results_v08/
          if-no-files-found: warn
          retention-days: 30
